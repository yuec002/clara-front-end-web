
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>STEPS OF 17</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>STEPS OF 17</h1>

    <!-- Domino Board -->
    <section id="board">

        <section id="domino-container">

            <!-- Domino 1: 0 + 1 = 1 -->
            <div class="domino">
                <div class="domino-face" data-value="0"></div>
                <div class="domino-face" data-value="1"></div>
            </div>

            <!-- Domino 2: 0 + 2 = 2 -->
            <div class="domino">
                <div class="domino-face" data-value="0"></div>
                <div class="domino-face" data-value="2"></div>
            </div>

            <!-- Domino 3: 1 + 2 = 3 -->
            <div class="domino">
                <div class="domino-face" data-value="1"></div>
                <div class="domino-face" data-value="2"></div>
            </div>

            <!-- Domino 4: 2 + 3 = 5 -->
            <div class="domino">
                <div class="domino-face" data-value="2"></div>
                <div class="domino-face" data-value="3"></div>
            </div>

            <!-- Domino 5: 1 + 5 = 6 -->
            <div class="domino">
                <div class="domino-face" data-value="1"></div>
                <div class="domino-face" data-value="5"></div>
            </div>

        </section>

    </section>

    <!-- Buttons -->
    <menu>
        <button id="ascending">Sort Ascending</button>

        <button id="descending">Sort Descending</button>

        <button id="sum-17">Sum of 17</button>
    </menu>

    <!-- Message -->
    <p id="message">Click a domino to flip it!</p>

</body>

</html>
