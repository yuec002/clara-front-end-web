<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STEPS OF 17</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>STEPS OF 17</h1>

  <p class="subtitle">
    17 is my lucky number.
  </p>

  <div id="board">

    <div id="domino-container">
      <!-- Dominoes are created here with JavaScript -->
    </div>

    <div class="buttons">
      <button id="ascending">Sort Ascending</button>
      <button id="descending">Sort Descending</button>
      <button id="sum">Sum of 17</button>
    </div>

    <p id="message"></p>

  </div>

  <script src="script.js"></script>

</body>
</html>
